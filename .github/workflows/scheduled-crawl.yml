name: Scheduled AKC Crawl

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run AKC crawl
        run: python crawl_akc_deep.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dog_breeds.db akc_crawl_results.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "breed-scholar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dog_breeds.db akc_crawl_results.json
          git commit -m "chore: scheduled AKC crawl and database update"
          git push
